version: "2"

run:
  timeout: 30m
  concurrency: 1
  go: "1.26.3"

linters:
  default: standard
  enable:
    - errname
    - errorlint
    - nilerr
    - exhaustive
    - gocritic
    - revive
    - misspell
    - nakedret
    - whitespace
    - prealloc
    - bodyclose
    - noctx
    - gosec
    - nolintlint

  settings:
    exhaustive:
      default-signifies-exhaustive: true

    gocritic:
      enabled-tags:
        - diagnostic
        - performance

    revive:
      rules:
        - name: exported
          arguments: [disableStutteringCheck]
        - name: if-return
        - name: error-return
        - name: error-naming
        - name: error-strings
        - name: var-naming
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: indent-error-flow
        - name: superfluous-else
        - name: unreachable-code

    nakedret:
      max-func-lines: 30

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

  exclusions:
    generated: lax
    rules:
      - path: '(^|.*/).*_test\.go$'
        linters:
          - gosec
          - noctx
          - bodyclose
          - errname
          - revive
          - gocritic
      - path: '(^|.*/)examples/.*\.go$'
        linters:
          - revive
          - gocritic
      - path: '(^|.*/)locales/.*\.go$'
        linters:
          - gocritic
          - revive
      - path: '(^|.*/)(core/(context|issues|parsing)\.go|internal/issues/.*\.go|jsonschema/to\.go|pkg/(regex/text|structx/structx|tagparser/(field_info|parser))\.go|types/(intersection|lazy|map|object|record|set|slice|struct|tuple)\.go)$'
        linters:
          - gocritic
      - path: '^(core/constants\.go|constructors_.*\.go|core\.go|errors\.go|jsonschema\.go|metadata\.go|structs\.go|types\.go|internal/issues/types\.go|pkg/coerce/coerce\.go|types/discriminated_union\.go|types/object\.go)$'
        linters:
          - revive
      - path: '(^|.*/)(internal/utils/utils\.go|types/(function|stringbool)\.go)$'
        text: 'var-naming: avoid meaningless package names'
        linters:
          - revive
      - path: '(^|.*/)(pkg/cloneutil/clone\.go|pkg/reflectx/types\.go|pkg/slicex/slicex\.go)$'
        linters:
          - nolintlint
      - path: '(^|.*/)(types/(function|lazy|never|nil|struct)\.go|types/network_test\.go)$'
        linters:
          - nolintlint
      - path: '^(core/issues\.go|errors\.go|internal/issues/types\.go)$'
        linters:
          - errname

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kaptinlin/gozod

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
